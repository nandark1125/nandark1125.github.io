<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <h1>Focus</h1>
    <div id="myData">
        <label for="name">Name</label>
        <input type="text" name="name" id="name">

        <br><br>

        <label for="gender">Gender</label>
        <br><br>
        <input type="radio" value="Male" id="male" name="Male">
        <label for="male">Male</label>

        <input type="radio" value="Female" id="female" name="Female">
        <label for="female">Female</label>
    
    <br><br>
    <form>

    <label for="hobbies">Hobbies</label>
    <div>
        <input type="checkbox" id="reading" name="hobbies" value="Reading">
        <label for="reading">Reading</label>
    </div>

    <div>
        <input type="checkbox" id="travelling" name="hobbies" value="Travelling">
        <label for="travelling">Travelling</label>
    </div>

    <div>
        <input type="checkbox" id="swimming" name="hobbies" value="Swimming">
        <label for="swimming">Swimming</label>
    </div>

    <div>
        <input type="checkbox" id="dancing" name="hobbies" value="Dancing">
        <label for="dancing">Dancing</label>
    </div>

    <br><br>
    <div>
        <label for="fName">Father Name</label>
        <input type="text" value="U Khin" id="fName" readonly>
    </div>
    </div>
</form>
</body>
</html>
