<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Condition</h1>

    <script>
        //if condition 

        let num = prompt("Enter a Number");

        if (num < 100) {
            document.write("This number is less than 100");  
        } 
        else if (num == 100) {
            document.write("This Number is equal to 100");
        }
        else {
            document.write("This Number is greater than 100");
        }
    </script>
    
</body>
</html>
