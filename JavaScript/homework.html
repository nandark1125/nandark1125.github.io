<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HomeWork </h1>

    <script>
        let num = parseInt(prompt("Enter A Number"));
        for(let i=0 ; i<=12; i++){
            document.write(`${num} * ${i} = ${num*i} <br>`);

        }

        

        for (let i=4; i>=0; i--){
            for(let k=0; k <= i; k++){
                document.write("*");
            }
            document.write('<br>');
        }


    </script>
</body>
</html>
