<body>
    <h1>Logical Operator</h1>

    <script>

        //OR Operator || ( if 1 true=true)
        let num1 = 10;
        let num2 = 20;
        let num3 = 30;
        console.log(num1 < num2 || num3 == num3);

        //AND Operator &&  ( if 1 false = false)
        console.log(num1<num2 && num3==num2 && num2< num1);

        //NOT Operator ! 
        let num4 = 40;
        console.log(!num4);
        console.log(!(num4<num3));
        
        
        
        
    </script>
    
</body>
