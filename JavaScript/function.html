<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Function Lessons</h1>

    <script>
        //Nameing Function

        function say(){
            document.write("<h3>Hello World</h3>");
        }
        //function call
        say();

        //function parameter
        function sum(num1,num2){
            let result = num1 + num2;
            document.write(`<h3>${num1} + ${num2} = ${result}</h3>`);
        }
        sum(10,5);
        sum(245,124);

        //default parameter function
        function mult(num1=5,num2=10){
            document.write(`<h3>${num1} * ${num2} = ${num1*num2}</h3>`);
        }
        mult();
        mult(123,543);

        //return functiion
        function sub(num1,num2){
            let result=num1-num2;
            return result;
        }

        let data =sub(10,5);

        if (data > 0){
            document.write(`<h3>Your Result is grateher than 0</h3>`);
        } 
        else{
            document.write(`<h3>Your Result is less than 0</h3>`);
        }
            
        
    </script>
    
</body>
</html>
