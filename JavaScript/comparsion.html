<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Comparsion lessons</h1>

    <script>
        //greater than => >
        let a = "9";
        let b = 9;
        console.log(a>b);

        //greater than equal => >=
        console.log(a >= b);

        //less than <
        console.log(a < b);

        //less tha equal <=
        console.log(a <= b);

        //equal == (only value comparsion)
        console.log(a == b);

        //triple equal === (value and data type comparsion)
        console.log(a === b);

        //not equal != (value)
        console.log(a != b);

        //not double equal !== (value & data type)
        console.log(a !== b);
        
        

        
        
        
        
        
        
    </script>
    
</body>
</html>
