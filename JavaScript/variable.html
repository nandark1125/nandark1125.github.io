<!DOCTYPE html>

<head>

<body>
    <h1>Variables</h1>

    <script>

        // global variable (var)
        var name = "Nandar";
        name ="Rina";
        console.log(name);


        //block scope variable (let)
        let fatherName = "U Khin Mg"
        fatherName = "U Khin Mg Update";
        console.log(fatherName);

        //const variable (const)
        const motherName = "Daw Tin San";
        console.log(motherName);

    </script>
</body>
