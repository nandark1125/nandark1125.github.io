<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Operator lessons</h1>

    <script>

        //assign operator => =

        //addition => +
        let number = 1276545 + 23456677;
        console.log(number);
        let FivFour = '5' + 4;
        console.log(FivFour);

        let no = 7;
        console.log(no);  //7
        //no = no + 3;
        no += 3;
        console.log(no); //10

        let num = 5;
        console.log(num++); //5
        console.log(num);  //6
        console.log(++num);

        //substraction => -
        let sub = 10 - 5;
        let num1 = 4;
        let result = sub - num1;
        console.log(sub);
        console.log(result);

        //multiplication => *
        let multi = 5 * 5;
        console.log(multi);
        multi *=5; //multi=multi*5
        console.log(multi);

        //division => /
        let div = 10 / 2;
        console.log(div);

        //remainder => %
        let remainder = 10 % 3;
        console.log(remainder);

        //exponent **
        let exp = 12 ** 5;
        console.log(exp);

        //presendence 
        let pre = (2+7) -6 *5 /3;
        console.log(pre);
        

    </script>
</body>
</html>
