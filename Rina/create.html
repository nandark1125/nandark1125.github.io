<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="create.css">
<body>
    <form action="#" method="get">
         <h1 class="caccount">Create Account </h1>
        <p>Join us today! Fill in the details to get started.</p>

        <label for="fullname">Full Name:</label> <br>
        <input type="text" name="stuFullname" id="fullname" placeholder="Enter Your Full Name"> 
        <br> <br>

        <label for="email">Email Address</label><br>
        <input type="email" name="stuEmail" id="email" placeholder="Enter Your Email">
        <br><br>

        <label for="password">Password</label><br>
        <input type="password" name="stuPassword" id="password" placeholder="Create a password">
        <br><br>

        <label for="password">Confirm Password</label><br>
        <input type="password" name="conpwd" id="password" placeholder="Confirm Your Password"> <br><br>

        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="male" value="Male"><label for="male">Male</label>

        <input type="radio" name="gender" id="female" value="Female"><label for="female">Female</label>

        <input type="radio" name="gender" id="others" value="Others"><label for="others">Others</label> <br><br>

        <input type="checkbox"> I agree to the terms & conditions and privacy policy 
        <br><br>

        <input type="submit" value="Sign Up"> <br><br>

        Already have an account? 
        <a href="#">Login</a>

    </form>
</body>
</html>
